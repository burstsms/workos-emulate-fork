name: Publish container image

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/burstsms/workos-emulate-fork

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Publish only from burstsms/workos-emulate-fork. A fork of this repo has
      # its own token and must not push ghcr.io/burstsms/workos-emulate-fork.
      - name: Image tags
        id: tags
        run: |
          set -eu
          publish=false
          tags="workos-emulate-fork:local"
          if [ "$GITHUB_REPOSITORY" = "burstsms/workos-emulate-fork" ]; then
            tags="${IMAGE}:${GITHUB_SHA}"
            if [ "$GITHUB_REF" = "refs/heads/main" ] && { [ "$GITHUB_EVENT_NAME" = "push" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; }; then
              tags="${tags},${IMAGE}:fork"
              publish=true
            fi
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: steps.tags.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ steps.tags.outputs.publish == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:fork
          cache-to: type=inline

      - name: Make the package public
        if: steps.tags.outputs.publish == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH \
            -H "Accept: application/vnd.github+json" \
            /orgs/burstsms/packages/container/workos-emulate-fork \
            -f visibility=public
